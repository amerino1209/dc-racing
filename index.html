<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Racing Store</title>
<meta name="description" content="Catálogo de DC Racing Store: repuestos, accesorios y equipo de BMX en Ecuador. Precios con IVA incluido. Consulta por WhatsApp.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="DC Racing Store">
<meta property="og:description" content="Catálogo con precios. Consulta por WhatsApp.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="tienda-192.png">
<link rel="apple-touch-icon" href="tienda-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Vitrina pública DC Racing Store. Paleta tomada del logo: rojo #ED1C24, negro y blanco.
   El rojo puro solo va en superficies grandes y en el logo; el texto rojo usa un tono más oscuro para leerse bien. */
:root{
  --bg:#ffffff; --soft:#f4f4f5; --soft-2:#ebebed; --line:#e2e3e6; --ink:#111214; --ink-2:#2a2c30; --muted:#5b5f67;
  --red:#ed1c24; --red-ink:#c3121a; --red-btn:#d3141c; --red-btn-h:#b10f16; --red-soft:#fdecec;
  --black:#0d0d0f; --on-black:#f5f5f6; --on-black-2:#b9bbc1;
  --shadow:0 12px 32px rgba(13,13,15,.16); --shadow-s:0 2px 8px rgba(13,13,15,.08);
  --f-display:"Saira","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --max:1280px; --gut:16px;
  color-scheme:light;
}
@media (min-width:768px){:root{--gut:24px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);overflow-x:hidden}
::selection{background:var(--red);color:#fff}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px;border-radius:4px}
input::placeholder{color:#686c74}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--black);color:#fff;padding:10px 14px;border-radius:8px}
.skip:focus{top:8px}

/* ---------- encabezado ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 12px;padding-block:8px}
.logo{display:block;justify-self:start;line-height:0;border-radius:4px}
.logo img{height:44px;width:auto}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.top-acts{display:flex;align-items:center;gap:4px}
.wa-top{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--black);color:#fff;text-decoration:none;font:700 .95rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.wa-top:hover{background:var(--ink-2)}
.wa-top span{display:none}
.search{grid-column:1/-1;grid-row:2;position:relative}
.top-acts{grid-column:3;grid-row:1}
.search form{display:flex;align-items:center;height:46px;border:1.5px solid var(--line);border-radius:999px;background:var(--soft);padding:0 6px 0 14px;transition:border-color .15s,background .15s}
.search form:focus-within{border-color:var(--ink);background:#fff}
.search input{flex:1;min-width:0;border:0;background:transparent;height:100%;font-size:1rem;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search .go{width:36px;height:36px;border:0;border-radius:999px;background:var(--red-btn);color:#fff;display:grid;place-items:center}
.search .go:hover{background:var(--red-btn-h)}
.search .go .ico{width:18px;height:18px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:min(70vh,520px);overflow:auto;z-index:50}
.sug h3{margin:8px 10px 4px;font:600 .78rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sug a{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 10px;border-radius:10px;text-decoration:none}
.sug a[aria-selected="true"],.sug a:hover{background:var(--soft)}
.sug .th{width:44px;height:44px;flex:none;border-radius:8px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.sug .th img{width:100%;height:100%;object-fit:contain;background:#fff}
.sug .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .pr{font:700 .95rem/1 var(--f-display);white-space:nowrap}
.sug .all{justify-content:center;color:var(--red-ink);font-weight:600}
.sug mark{background:none;color:inherit;font-weight:700}
@media (min-width:768px){
  .top-in{grid-template-columns:auto minmax(0,1fr) auto;gap:20px}
  .search{grid-column:2;grid-row:1;max-width:620px;width:100%;justify-self:center}
  .wa-top span{display:inline}
  .logo img{height:52px}
}

/* ---------- menú de categorías (escritorio) ---------- */
.nav{background:var(--black);color:var(--on-black);position:relative}
.nav #navL1{list-style:none;margin:0;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav #navL1::-webkit-scrollbar{display:none}
#navL1>li>a,#navL1>li>button{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--on-black);text-decoration:none;white-space:nowrap;font:italic 700 1rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
#navL1>li>button .ico{width:16px;height:16px;transition:transform .2s}
#navL1>li>button[aria-expanded="true"]{background:var(--red-btn);color:#fff}
#navL1>li>button[aria-expanded="true"] .ico{transform:rotate(180deg)}
#navL1>li>a:hover,#navL1>li>button:hover{color:#fff;background:#1d1e22}
#navL1>li>a.on,#navL1>li>button.on{box-shadow:inset 0 -3px var(--red)}
#navL1>li>button[aria-expanded="true"]:hover{background:var(--red-btn-h)}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:45}
.mega-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 32px;padding-block:24px 28px}
.mega h4{margin:0 0 8px;font:italic 700 1.02rem/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.mega h4 a{text-decoration:none}
.mega h4 a:hover{color:var(--red-ink)}
.mega ul{display:block;overflow:visible;list-style:none;margin:0;padding:0}
.mega li a{display:block;padding:7px 0;color:var(--muted);text-decoration:none;font-size:.97rem}
.mega li a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.mega .ver{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
.mega .ver a{color:var(--red-ink);font-weight:600;text-decoration:none}
.nav{display:none}
@media (min-width:960px){ .nav{display:block} .menu-btn{display:none} }

/* ---------- menú lateral (celular) ---------- */
.drawer-bg{position:fixed;inset:0;z-index:60;background:rgba(13,13,15,.5);opacity:0;transition:opacity .25s}
.drawer-bg.open{opacity:1}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:62;width:min(88vw,380px);background:#fff;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .3s cubic-bezier(.16,1,.3,1);padding-top:env(safe-area-inset-top,0px)}
.drawer.right{left:auto;right:0;transform:translateX(102%)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font:italic 800 1.25rem/1 var(--f-display);text-transform:uppercase}
.drawer-b{flex:1;overflow:auto;padding:8px 0 24px;overscroll-behavior:contain}
.drawer-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px}
.tree{list-style:none;margin:0;padding:0}
.tree a,.tree button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:0 20px;border:0;background:none;text-align:left;text-decoration:none}
.tree>li>a,.tree>li>button{font:italic 700 1.08rem/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.tree>li{border-bottom:1px solid var(--soft-2)}
.tree ul{list-style:none;margin:0;padding:0 0 8px}
.tree ul a{min-height:44px;padding-left:32px;color:var(--ink-2)}
.tree ul ul a{padding-left:48px;color:var(--muted);font-size:.96rem}
.tree .ico{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
.tree button[aria-expanded="true"] .ico{transform:rotate(180deg)}
.tree .n{color:var(--muted);font:500 .85rem/1 var(--f-body);font-variant-numeric:tabular-nums}
.drawer-contact{padding:20px;display:grid;gap:6px;color:var(--muted);font-size:.95rem}

/* ---------- franja de inicio ---------- */
.strip{background:var(--black);color:var(--on-black-2);font-size:.9rem}
.strip .wrap{display:flex;flex-wrap:wrap;gap:4px 18px;padding-block:9px}
.strip b{color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 0 2px;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;text-decoration:none;font:600 .95rem/1 var(--f-body);white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (min-width:960px){ .chips.l1{display:none} }

/* ---------- catálogo ---------- */
main{min-height:60vh}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:16px 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;padding:4px 0}
.crumbs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs li+li::before{content:"/";margin-right:6px;color:#a2a5ab}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:10px 0 18px}
.head h1{margin:0;font:italic 800 clamp(1.75rem,1.2rem + 2.2vw,2.75rem)/1.02 var(--f-display);text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.head .count{margin:6px 0 0;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;height:44px;padding:0 38px 0 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:500;max-width:100%}
.sel .ico{position:absolute;right:10px;top:50%;width:18px;height:18px;margin-top:-9px;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ink-2)}
.btn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red-btn);color:#fff;font-size:.78rem;display:inline-grid;place-items:center}
.filt-btn{display:inline-flex}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:960px){
  .layout{grid-template-columns:240px minmax(0,1fr)}
  .filt-btn{display:none}
}
.active{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.active button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 14px;border:0;border-radius:999px;background:var(--soft);font-size:.92rem}
.active button:hover{background:var(--soft-2)}
.active .ico{width:16px;height:16px}
.active .clear{background:none;color:var(--red-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* filtros: columna en escritorio, panel en celular */
.filters{display:grid;gap:4px}
.fgroup{border-bottom:1px solid var(--line);padding:6px 0 14px}
.fgroup:last-child{border-bottom:0}
.fgroup h3{margin:12px 0 8px;font:italic 700 1rem/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.fgroup .find{width:100%;height:40px;padding:0 12px;margin:0 0 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft)}
.fgroup .find:focus{outline:none;border-color:var(--ink);background:#fff}
.opts{display:grid;gap:0;max-height:320px;overflow:auto;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:.97rem}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--red-btn);flex:none}
.chk .nm{flex:1;min-width:0}
.chk .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.chk.off{color:#9a9da3}
.sublist{list-style:none;margin:0;padding:0}
.sublist a{display:flex;justify-content:space-between;gap:8px;min-height:40px;align-items:center;text-decoration:none;color:var(--ink-2)}
.sublist a:hover{color:var(--red-ink)}
.sublist .n{color:var(--muted);font-size:.85rem}
.price-in{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.price-in label{position:relative}
.price-in span.s{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.price-in input{width:100%;height:44px;padding:0 10px 0 22px;border:1.5px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.price-in input:focus{outline:none;border-color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:40px;min-width:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:.93rem}
.pills button:hover{border-color:var(--ink)}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:959.98px){
  .layout>.filters{position:fixed;top:0;bottom:0;right:0;z-index:61;width:min(92vw,400px);background:#fff;display:flex;flex-direction:column;gap:0;transform:translateX(102%);visibility:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),visibility 0s .3s;padding-top:env(safe-area-inset-top,0px)}
  .layout>.filters.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .filters .fbody{flex:1;overflow:auto;padding:0 20px 16px;overscroll-behavior:contain}
}
@media (min-width:960px){
  .filters .drawer-h,.filters .drawer-f{display:none}
  .filters{position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto;padding-right:6px;scrollbar-width:thin}
}

/* rejilla de productos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 18px} }
@media (min-width:1200px){ .grid.wide{grid-template-columns:repeat(4,minmax(0,1fr))} }
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;min-width:0}
.card .ph{position:relative;aspect-ratio:1;border-radius:var(--r);background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:8%;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.card:hover .ph img{transform:scale(1.04)}
.card:hover .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.ph.empty::after{content:"";width:42%;aspect-ratio:1;background:url("tienda-192.png") center/contain no-repeat;opacity:.09;filter:grayscale(1)}
.tag{position:absolute;top:8px;left:8px;z-index:1;padding:4px 8px;border-radius:6px;background:var(--red-btn);color:#fff;font:italic 800 .86rem/1 var(--f-display);letter-spacing:.02em}
.tag.etq{background:var(--black)}
.tag2{position:absolute;bottom:8px;left:8px;z-index:1;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:600}
.card .info{padding:10px 2px 0;display:grid;gap:3px}
.card .mk{font-size:.78rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nm{font-size:.98rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-variant-numeric:tabular-nums}
.price .now{font:italic 800 1.18rem/1.1 var(--f-display);letter-spacing:.005em}
.price .now.sale{color:var(--red-ink)}
.price .was{color:var(--muted);text-decoration:line-through;font-size:.9rem}
.price .from{font-size:.82rem;color:var(--muted);font-weight:500;margin-right:-4px}
.price .ask{font:600 .95rem/1.2 var(--f-body);color:var(--ink-2)}
.card .opts-n{font-size:.82rem;color:var(--muted)}
.more{display:flex;flex-direction:column;align-items:center;gap:10px;margin:36px 0 8px;color:var(--muted);font-size:.92rem}
.empty-st{padding:48px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty-st h2{margin:0;color:var(--ink);font:italic 800 1.5rem/1.1 var(--f-display);text-transform:uppercase}
.empty-st p{margin:0;max-width:44ch}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--soft) 0,var(--soft-2) 40%,var(--soft) 80%) 0 0/300% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{to{background-position:-150% 0}}

/* ---------- ficha de producto ---------- */
.pd{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:14px}
@media (min-width:860px){ .pd{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px} }
.gal{display:grid;gap:10px;align-content:start}
@media (min-width:860px){ .gal{position:sticky;top:150px} }
.gal .main{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;display:grid;place-items:center}
.gal .main img{width:100%;height:100%;object-fit:contain;padding:6%}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:none;width:68px;height:68px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:4px;display:grid;place-items:center;overflow:hidden}
.thumbs button img{width:100%;height:100%;object-fit:contain}
.thumbs button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pi{display:grid;gap:18px;align-content:start}
.pi .mk{font-size:.86rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.pi .mk:hover{color:var(--red-ink)}
.pi h1{margin:4px 0 0;font:italic 800 clamp(1.6rem,1.2rem + 1.6vw,2.4rem)/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance}
.pi .price .now{font-size:clamp(1.7rem,1.4rem + 1vw,2.1rem)}
.pi .price .was{font-size:1.05rem}
.pi .price .off{align-self:center;padding:4px 8px;border-radius:6px;background:var(--red-btn);color:#fff;font:italic 800 .9rem/1 var(--f-display)}
.pi .iva{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.pi .dsc-note{margin:6px 0 0;color:var(--red-ink);font-size:.9rem;font-weight:600}
.attr{display:grid;gap:8px}
.attr .lab{display:flex;gap:8px;align-items:baseline;font-weight:600}
.attr .lab span{font-weight:400;color:var(--muted)}
.optbtns{display:flex;flex-wrap:wrap;gap:8px}

<script type="module">
// ---------------------------------------------------------------------------------------------------------------
// Vitrina pública. Lee la copia publicada por el panel (Firestore publico/catalogo, publico/items-N y pubfotos/{código}).
// Esa copia nunca trae costos ni cantidades: por cada opción solo dice si está disponible (sí o no).
// Sin carrito: cada producto se consulta por WhatsApp con un mensaje ya armado.
// ---------------------------------------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const money = n => '$' + Number(n||0).toLocaleString('es-EC',{minimumFractionDigits:2, maximumFractionDigits:2});
const ico = (id, cls='ico') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const WA_DEFECTO = '593996857700', PAGE = 24;

// ---------- fuente de datos ----------
const V = '10.14.1';
let fsMod = null, fsDb = null;
async function fs(){
  if (!fsDb){
    const [app, lite] = await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`), import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-lite.js`)]);
    fsMod = lite; fsDb = lite.getFirestore(app.initializeApp(window.FIREBASE_CONFIG));
  }
  return fsDb;
}
async function leer(col, id){ const db = await fs(); const s = await fsMod.getDoc(fsMod.doc(db, col, id)); return s.exists() ? s.data() : null; }
const FUENTE = window.VITRINA_FUENTE || {
  async catalogo(){
    const c = await leer('publico', 'catalogo');
    if (!c) return null;
    const partes = await Promise.all(Array.from({length:c.partes||0}, (_, i) => leer('publico', 'items-'+i)));
    return {...c, items: partes.flatMap(p => (p && p.items) || [])};
  },
  async foto(code){ const d = await leer('pubfotos', code); return d && d.d ? 'data:image/jpeg;base64,'+d.d : null; },
};

// ---------- estado ----------
let D = null;               // catálogo publicado
const CAT = new Map(), KIDS = new Map(), MK = new Map();
let ITEMS = [], BYID = new Map();
let shown = PAGE, lastKey = '';

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(_){} },
};

// ---------- precios: mismo cálculo que el panel ----------
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function dscActivo(d){
  if (!d || !d.tipo || !(Number(d.valor) > 0)) return false;
  const h = hoy(); return !(d.desde && h < d.desde) && !(d.hasta && h > d.hasta);
}
function precio(it, v){
  const base = Number(v.v) || 0, d = it.dsc, o = v.dv;
  if (!dscActivo(d) || (o && o.sin) || !base) return {v:base, f:base, pct:0};
  const val = o && o.valor != null ? Number(o.valor) : Number(d.valor);
  if (!(val > 0)) return {v:base, f:base, pct:0};
  const f = Math.max(0, Math.round((d.tipo==='%' ? base*(1-val/100) : d.tipo==='=' ? Math.min(base, val) : base - val) * 100) / 100);
  return {v:base, f, pct: Math.round((1 - f/base) * 100)};
}

// ---------- preparar datos ----------
function preparar(d){
  D = d; CAT.clear(); KIDS.clear(); MK.clear();
  for (const c of d.cats || []){ CAT.set(c.id, c); const k = c.padre || ''; if (!KIDS.has(k)) KIDS.set(k, []); KIDS.get(k).push(c); }
  for (const l of KIDS.values()) l.sort((a,b) => (a.orden||0) - (b.orden||0) || a.n.localeCompare(b.n,'es'));
  for (const m of d.marcas || []) MK.set(m.id, m);
  ITEMS = (d.items || []).map((it, i) => {
    const vs = it.vs || [];
    const pr = vs.map(v => ({...precio(it, v), ok:v.ok}));
    const conPrecio = pr.filter(p => p.v > 0), disp = conPrecio.filter(p => p.ok);
    const ref = (disp.length ? disp : conPrecio);
    const min = ref.length ? ref.reduce((a,b) => b.f < a.f ? b : a) : null;
    const maxF = ref.length ? Math.max(...ref.map(p => p.f)) : 0;
    const pct = Math.max(0, ...pr.map(p => p.pct));
    const attrs = (it.attrs || []).map(a => typeof a === 'string' ? {k:'', n:a} : a);
    const medidas = new Set(); attrs.forEach((a, j) => { if (a.k === 'me') vs.forEach(v => v.o[j] && medidas.add(v.o[j])); });
    const ruta = rutaCat(it.cx);
    const mk = MK.get(it.mk);
    const hay = norm([it.n, mk && mk.n, ...ruta.map(c => c.n), ...vs.flatMap(v => [...(v.o||[]), v.c])].join(' '));
    return {...it, attrs, i, min, maxF, pct, disp: disp.length > 0 || !conPrecio.length && vs.some(v => v.ok), ruta, mkN: mk ? mk.n : '', medidas:[...medidas], hay};
  });
  BYID = new Map(ITEMS.map(it => [it.id, it]));
  const t = d.tienda || {};
  WA = String(t.whatsapp || WA_DEFECTO).replace(/[^\d]/g,'') || WA_DEFECTO;
  TIENDA = {nombre:'DC Racing Store', ...t};
}
let WA = WA_DEFECTO, TIENDA = {nombre:'DC Racing Store'};
function rutaCat(id){ const out = []; for (let c = CAT.get(id); c; c = c.padre ? CAT.get(c.padre) : null) out.unshift(c); return out; }
function descendientes(id){ const s = new Set([id]); const st = [id]; while (st.length){ for (const k of KIDS.get(st.pop()) || []){ s.add(k.id); st.push(k.id); } } return s; }
const COUNT = new Map();
function contar(){
  COUNT.clear();
  for (const it of ITEMS) for (const c of it.ruta) COUNT.set(c.id, (COUNT.get(c.id)||0) + 1);
}

// ---------- rutas: #/  #/c/<id>  #/p/<id>  #/buscar   (+ ?q=&m=&me=&min=&max=&o=) ----------
function route(){
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const p = new URLSearchParams(qs || '');
  const seg = path.split('/').filter(Boolean);
  const r = {view:'cat', cat:'', id:'', q:p.get('q')||'', m:(p.get('m')||'').split(',').filter(Boolean), me:(p.get('me')||'').split('|').filter(Boolean),
             min:p.get('min')||'', max:p.get('max')||'', o:p.get('o')||''};
  if (seg[0]==='p'){ r.view = 'prod'; r.id = decodeURIComponent(seg[1]||''); }
  else if (seg[0]==='c') r.cat = decodeURIComponent(seg.slice(1).join('/'));
  else if (seg[0]==='marca') r.m = [decodeURIComponent(seg[1]||'')];
  return r;
}
function href(r){
  const base = r.view==='prod' ? `#/p/${encodeURIComponent(r.id)}` : r.cat ? `#/c/${r.cat.split('/').map(encodeURIComponent).join('/')}` : (r.q ? '#/buscar' : '#/');
  const p = new URLSearchParams();
  if (r.view!=='prod'){
    if (r.q) p.set('q', r.q);
    if (r.m && r.m.length) p.set('m', r.m.join(','));
    if (r.me && r.me.length) p.set('me', r.me.join('|'));
    if (r.min) p.set('min', r.min);
    if (r.max) p.set('max', r.max);
    if (r.o) p.set('o', r.o);
  }
  const s = p.toString(); return base + (s ? '?' + s : '');
}
const prodHref = it => `#/p/${encodeURIComponent(it.id)}`;
const catHref = id => href({cat:id});
function go(r, keepScroll){ const h = href(r); keepScroll ? history.replaceState(null, '', h) : (location.hash = h); if (keepScroll) render(true); }

// ---------- fotos ----------
const FOTO = new Map();
function fotoDe(code){
  if (!code) return Promise.resolve(null);
  if (!FOTO.has(code)) FOTO.set(code, FUENTE.foto(code).catch(() => null));
  return FOTO.get(code);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); pintarFoto(e.target); } }), {rootMargin:'300px'}) : null;
function pintarFoto(el){
  const code = el.dataset.ft; if (!code) return;
  fotoDe(code).then(src => {
    if (!src || el.dataset.ft !== code) { el.classList.add('empty'); return; }
    let img = el.querySelector('img');
    if (!img){ img = document.createElement('img'); img.alt = el.dataset.alt || ''; img.decoding = 'async'; el.appendChild(img); }
    img.src = src; el.classList.remove('empty');
  });
}
function observarFotos(root){ root.querySelectorAll('[data-ft]').forEach(el => io ? io.observe(el) : pintarFoto(el)); }

// ---------- piezas ----------
function precioHtml(it, p){
  // p: precio de una opción concreta o null para el rango de la ficha
  if (p){
    if (!p.v) return `<span class="ask">Consultar precio</span>`;
    return p.pct > 0 ? `<span class="now sale">${money(p.f)}</span><span class="was">${money(p.v)}</span>` : `<span class="now">${money(p.f)}</span>`;
  }
  if (!it.min) return `<span class="ask">Consultar precio</span>`;
  const desde = it.maxF > it.min.f ? '<span class="from">Desde</span>' : '';
  return desde + (it.min.pct > 0 ? `<span class="now sale">${money(it.min.f)}</span><span class="was">${money(it.min.v)}</span>` : `<span class="now">${money(it.min.f)}</span>`);
}
function card(it){
  const tag = it.pct > 0 ? `<span class="tag">-${it.pct}%</span>` : (dscActivo(it.dsc) && it.dsc.etq ? `<span class="tag etq">${esc(it.dsc.etq)}</span>` : '');
  const n = (it.vs||[]).length;
  return `<a class="card" href="${prodHref(it)}">
    <div class="ph${it.ft?'':' empty'}" ${it.ft?`data-ft="${esc(it.ft)}" data-alt="${esc(it.n)}"`:''}>${tag}${it.disp?'':'<span class="tag2">Agotado</span>'}</div>
    <div class="info">${it.mkN?`<span class="mk">${esc(it.mkN)}</span>`:''}<span class="nm">${esc(it.n)}</span>
      <span class="price">${precioHtml(it)}</span>${n>1?`<span class="opts-n">${n} opciones</span>`:''}</div></a>`;
}
function skeleton(){
  return `<div class="head"><div><div class="skel" style="height:36px;width:240px"></div></div></div>
    <div class="grid wide">${Array.from({length:8}, () => `<div><div class="skel" style="aspect-ratio:1"></div><div class="skel" style="height:14px;margin-top:12px;width:80%"></div><div class="skel" style="height:18px;margin-top:8px;width:40%"></div></div>`).join('')}</div>`;
}
function waLink(msg){ return `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`; }
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

// ---------- menú de categorías ----------
function pintarMenus(r){
  const l1 = (KIDS.get('') || []).filter(c => COUNT.get(c.id));
  const activo = rutaCat(r.cat)[0]?.id || '';
  $('navL1').innerHTML = `<li><a href="#/" class="${!r.cat && r.view!=='prod' && !r.q?'on':''}">Todo</a></li>` + l1.map(c => {
    const kids = (KIDS.get(c.id) || []).filter(k => COUNT.get(k.id));
    return kids.length
      ? `<li><button type="button" data-l1="${esc(c.id)}" aria-expanded="false" aria-controls="mega" class="${activo===c.id?'on':''}">${esc(c.n)}${ico('down')}</button></li>`
      : `<li><a href="${catHref(c.id)}" class="${activo===c.id?'on':''}">${esc(c.n)}</a></li>`;
  }).join('');
  $('tree').innerHTML = `<li><a href="#/">Todos los productos <span class="n">${ITEMS.length}</span></a></li>` + l1.map(c => {
    const kids = (KIDS.get(c.id) || []).filter(k => COUNT.get(k.id));
    if (!kids.length) return `<li><a href="${catHref(c.id)}">${esc(c.n)} <span class="n">${COUNT.get(c.id)}</span></a></li>`;
    return `<li><button type="button" aria-expanded="${activo===c.id}" data-acc>${esc(c.n)}${ico('down')}</button>
      <ul ${activo===c.id?'':'hidden'}><li><a href="${catHref(c.id)}">Ver todo en ${esc(c.n)} <span class="n">${COUNT.get(c.id)}</span></a></li>${kids.map(k => {
        const g = (KIDS.get(k.id) || []).filter(x => COUNT.get(x.id));
        return `<li><a href="${catHref(k.id)}">${esc(k.n)} <span class="n">${COUNT.get(k.id)}</span></a>${g.length ? `<ul>${g.map(x => `<li><a href="${catHref(x.id)}">${esc(x.n)} <span class="n">${COUNT.get(x.id)}</span></a></li>`).join('')}</ul>` : ''}</li>`;
      }).join('')}</ul></li>`;
  }).join('');
  $('drawerContact').innerHTML = contactoHtml(true);
}
function abrirMega(id){
  const btns = [...document.querySelectorAll('#navL1 [data-l1]')];
  const mega = $('mega');
  const yaAbierto = btns.find(b => b.dataset.l1 === id && b.getAttribute('aria-expanded') === 'true');
  btns.forEach(b => b.setAttribute('aria-expanded', 'false'));
  if (!id || yaAbierto){ mega.hidden = true; return; }
  const c = CAT.get(id), kids = (KIDS.get(id) || []).filter(k => COUNT.get(k.id));
  mega.innerHTML = `<div class="wrap mega-in">${kids.map(k => {
    const g = (KIDS.get(k.id) || []).filter(x => COUNT.get(x.id));
    return `<div><h4><a href="${catHref(k.id)}">${esc(k.n)}</a></h4>${g.length ? `<ul>${g.map(x => `<li><a href="${catHref(x.id)}">${esc(x.n)}</a></li>`).join('')}</ul>` : ''}</div>`;
  }).join('')}<div class="ver"><a href="${catHref(id)}">Ver todo en ${esc(c.n)} (${COUNT.get(id)})</a></div></div>`;
  btns.find(b => b.dataset.l1 === id)?.setAttribute('aria-expanded', 'true');
  mega.hidden = false;
}

function buscar(list, q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return list;
  return list.filter(it => toks.every(t => it.hay.includes(t)));
}
function resaltar(txt, q){
  const toks = norm(q).split(/\s+/).filter(t => t.length > 1); let out = esc(txt);
  if (!toks.length) return out;
  const n = norm(txt); const marks = [];
  for (const t of toks){ const i = n.indexOf(t); if (i >= 0) marks.push([i, i + t.length]); }
  if (!marks.length) return out;
  marks.sort((a,b) => a[0]-b[0]); let s = '', at = 0;
  for (const [a, b] of marks){ if (a < at) continue; s += esc(txt.slice(at, a)) + '<mark>' + esc(txt.slice(a, b)) + '</mark>'; at = b; }
  return s + esc(txt.slice(at));
}

const ORDEN = [['', 'Destacados'], ['new', 'Más nuevos'], ['pa', 'Precio: menor a mayor'], ['pd', 'Precio: mayor a menor'], ['az', 'Nombre: A a Z']];
function filtrar(r, sin){
  let L = ITEMS;
  if (r.cat){ const s = descendientes(r.cat); L = L.filter(it => s.has(it.cx)); }
  if (r.q) L = buscar(L, r.q);
  const min = parseFloat(r.min), max = parseFloat(r.max);
  if (sin !== 'p' && (min > 0 || max > 0)) L = L.filter(it => it.min && (!(min > 0) || it.maxF >= min) && (!(max > 0) || it.min.f <= max));
  if (sin !== 'me' && r.me.length) L = L.filter(it => it.medidas.some(x => r.me.includes(x)));
  if (sin !== 'm' && r.m.length) L = L.filter(it => r.m.includes(it.mk));
  return L;
}
function ordenar(L, o){
  const P = it => it.min ? it.min.f : Infinity;
  const c = [...L];
  if (o === 'pa') c.sort((a,b) => P(a) - P(b));
  else if (o === 'pd') c.sort((a,b) => (b.min?b.min.f:-1) - (a.min?a.min.f:-1));
  else if (o === 'az') c.sort((a,b) => a.n.localeCompare(b.n, 'es'));
  else if (o === 'new') c.sort((a,b) => String(b.upd).localeCompare(String(a.upd)));
  else c.sort((a,b) => (b.disp - a.disp) || ((b.pct > 0) - (a.pct > 0)) || (!!b.ft - !!a.ft) || a.i - b.i);
  return c;
}

  if (!code) return;
  FT_VISTA = code; const m = $('galMain'); m.dataset.ft = code; m.dataset.alt = BYID.get(route().id)?.n || ''; pintarFoto(m);
  $('thumbs').querySelectorAll('[data-thumb]').forEach(b => b.setAttribute('aria-pressed', b.dataset.thumb === code));
}
function elegida(it){ const vs = it.vs || []; return SEL.every(s => s != null) ? vs.find(v => v.o.every((o, j) => o === SEL[j])) || null : null; }
function pintarOpciones(it, vari){
  const vs = it.vs || [];
  $('pAttrs').innerHTML = it.attrs.map((a, j) => {
    if (!vari[j]) return '';
    const vals = [...new Set(vs.map(v => v.o[j] || ''))].sort((x, y) => x.localeCompare(y, 'es', {numeric:true}));
    return `<div class="attr" role="group" aria-label="${esc(a.n)}"><div class="lab">${esc(a.n)}${SEL[j] != null ? `<span>${esc(SEL[j] || 'Única')}</span>` : '<span>Elige una opción</span>'}</div><div class="optbtns">${vals.map(x => {
      const alguna = vs.some(v => v.ok && (v.o[j]||'') === x);
      const compatible = vs.some(v => v.ok && (v.o[j]||'') === x && v.o.every((o, k) => k === j || SEL[k] == null || o === SEL[k]));
      const on = SEL[j] === x;
      return `<button type="button" data-j="${j}" data-v="${esc(x)}" aria-pressed="${on}" ${!alguna ? 'disabled aria-label="'+esc(x || 'Única')+', no disponible"' : ''} class="${alguna && !compatible && !on ? 'alt' : ''}">${esc(x || 'Única')}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  const v = elegida(it);
  const p = v ? precio(it, v) : null;
  const d = it.dsc && dscActivo(it.dsc) ? it.dsc : null;
  const pct = p ? p.pct : it.pct;
  $('pPrecio').innerHTML = `<div class="price">${precioHtml(it, p)}${pct > 0 && (p ? p.pct : it.min && it.min.pct) ? `<span class="off">-${p ? p.pct : it.min.pct}%</span>` : ''}</div>
    <p class="iva">Precio con IVA incluido${!p && it.maxF > (it.min?.f||0) ? ' · cambia según la opción' : ''}</p>${d && (d.etq || d.hasta) && pct > 0 ? `<p class="dsc-note">${esc(d.etq || 'Promoción')}${d.hasta ? ` hasta el ${new Date(d.hasta + 'T12:00:00').toLocaleDateString('es-EC', {day:'numeric', month:'long'})}` : ''}</p>` : ''}`;
  $('stPrecio').innerHTML = precioHtml(it, p);
  const nota = !it.disp ? `<div class="note out">Agotado por ahora. Escríbenos y te avisamos cuando vuelva a llegar.</div>`
    : v && !v.ok ? `<div class="note out">Esta opción está agotada. Elige otra o pregúntanos cuándo llega.</div>`
    : vari.some(Boolean) && !v ? `<p class="hint">Elige ${it.attrs.filter((a, j) => vari[j] && SEL[j] == null).map(a => a.n.toLowerCase()).join(' y ')} para consultar por esa opción, o pregúntanos directamente.</p>` : '';
  $('pNota').innerHTML = nota;
  // mensaje de WhatsApp: nombre, opción, precio y enlace
  const opc = it.attrs.map((a, j) => SEL[j] ? `${a.n}: ${SEL[j]}` : '').filter(Boolean).join(' · ');
  const pr = p ? (p.v ? money(p.f) + (p.pct > 0 ? ` (antes ${money(p.v)})` : '') : 'por consultar') : (it.min ? (it.maxF > it.min.f ? 'desde ' : '') + money(it.min.f) : 'por consultar');
  const url = location.origin + location.pathname + prodHref(it);
  const msg = [`Hola ${TIENDA.nombre}, me interesa este producto:`, `*${it.n}*`, opc || (vari.some(Boolean) ? 'Opción: por definir' : ''), `Precio: ${pr} con IVA`, v ? `Ref.: ${v.c}` : (vs.length === 1 ? `Ref.: ${vs[0].c}` : ''), url].filter(Boolean).join('\n');
  $('pWa').href = $('stWa').href = waLink(msg);
  // detalles fijos de la opción elegida (o los comunes a todas)
  const filas = it.attrs.map((a, j) => { const val = SEL[j] != null ? SEL[j] : null; return val ? [a.n, val] : null; }).filter(Boolean);
  if (it.mkN) filas.unshift(['Marca', it.mkN]);
  if (v) filas.push(['Referencia', v.c]); else if (vs.length === 1) filas.push(['Referencia', vs[0].c]);
  $('pSpecs').innerHTML = filas.length ? `<h2>Detalles</h2><dl>${filas.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>` : '';
  if (v && v.ft && v.ft !== FT_VISTA) verFoto(v.c);
}
function relHtml(it){
  const padre = it.ruta[it.ruta.length - 1];
  if (!padre) return '';
  const s = descendientes(padre.id);
  let L = ITEMS.filter(x => x.id !== it.id && s.has(x.cx) && x.disp);
  L = ordenar(L, '').slice(0, 8);
  if (L.length < 2) return '';
  return `<section class="rel" aria-label="Productos relacionados"><div class="rel-h"><h2>Más en ${esc(padre.n)}</h2><a href="${catHref(padre.id)}">Ver todo</a></div><div class="grid wide">${L.map(card).join('')}</div></section>`;
}

// ---------- contacto y pie ----------
function contactoHtml(corto){
  const t = TIENDA, ig = String(t.instagram || '').replace(/^@/, '').trim();
  const fb = String(t.facebook || '').trim();
  const fbUrl = fb ? (/^https?:\/\//.test(fb) ? fb : 'https://facebook.com/' + fb.replace(/^@/, '')) : '';
  const waTxt = '+' + WA.replace(/^(\d{3})(\d{2})(\d{3})(\d{4})$/, '$1 $2 $3 $4');
  const items = [
    `<a href="${waLink(`Hola ${t.nombre}`)}" target="_blank" rel="noopener">WhatsApp ${esc(waTxt)}</a>`,
    t.tel ? `<a href="tel:${esc(String(t.tel).replace(/[^\d+]/g, ''))}">Teléfono ${esc(t.tel)}</a>` : '',
    t.email ? `<a href="mailto:${esc(t.email)}">${esc(t.email)}</a>` : '',
    ig ? `<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">Instagram @${esc(ig)}</a>` : '',
    fbUrl ? `<a href="${esc(fbUrl)}" target="_blank" rel="noopener">Facebook</a>` : '',
  ].filter(Boolean);
  if (corto) return items.join('') + (t.horario ? `<span>${esc(t.horario)}</span>` : '');
  return items;
}
function pintarPie(){
  const t = TIENDA;
  const l1 = (KIDS.get('') || []).filter(c => COUNT.get(c.id));
  $('foot').innerHTML = `<div><h2>DC Racing <b>Store</b></h2>${t.direccion ? `<p>${esc(t.direccion)}</p>` : ''}${t.horario ? `<p>${esc(t.horario)}</p>` : ''}
      <a class="wa" href="${waLink(`Hola ${t.nombre}`)}" target="_blank" rel="noopener">${ico('chat')}Escríbenos</a></div>
    <div><h3>Catálogo</h3><ul>${l1.map(c => `<li><a href="${catHref(c.id)}">${esc(c.n)}</a></li>`).join('')}</ul></div>
    <div><h3>Contacto</h3><ul>${contactoHtml(false).map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  $('waTop').href = waLink(`Hola ${t.nombre}, tengo una consulta.`);
}
function pintarFranja(r){
  $('strip').innerHTML = (r.view === 'cat' && !r.cat && !r.q && !r.m.length) ? `<div class="strip"><div class="wrap"><span><b>Precios con IVA incluido</b></span><span>Consulta disponibilidad por WhatsApp</span></div></div>` : '';
}

// ---------- render ----------
function render(keepScroll){
  const r = route();
  abrirMega(''); cerrarSug();
  if (panelAbierto === 'drawer') panel('drawer', false);
  document.body.classList.remove('has-sticky');
  if (!D){ $('view').innerHTML = skeleton(); return; }
  if (r.view === 'cat') $('q').value = r.q;
  pintarMenus(r); pintarFranja(r);
  if (r.view === 'prod') renderProd(r); else renderCat(r, keepScroll);
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const r = route(); if (panelAbierto === 'filters' && r.view === 'cat') { render(true); reabrir(); } else { if (panelAbierto) panel(panelAbierto, false); render(false); } });

// ---------- arranque: primero lo guardado en este navegador, luego lo último publicado ----------
function sinDatos(err){
  $('view').innerHTML = `<div class="empty-st"><h2>${err ? 'No pudimos cargar el catálogo' : 'Catálogo en preparación'}</h2><p>${err ? 'Revisa tu conexión y vuelve a intentar. Mientras tanto, puedes escribirnos.' : 'Muy pronto vas a ver aquí nuestros productos. Mientras tanto, escríbenos y te ayudamos.'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${err ? '<button class="btn" type="button" onclick="location.reload()">Reintentar</button>' : ''}<a class="btn dark" href="${waLink(`Hola ${TIENDA.nombre}, tengo una consulta.`)}" target="_blank" rel="noopener">${ico('chat')}Escribir por WhatsApp</a></div></div>`;
}
(async () => {
  pintarPie();
  const guardado = store.get('dcv-cat');
  if (guardado){ try{ preparar(JSON.parse(guardado)); contar(); pintarPie(); }catch(_){ D = null; } }
  render(true);
  try{
    const d = await FUENTE.catalogo();
    if (!d){ if (!D) sinDatos(false); return; }
    if (D && D.h === d.h) return;
    preparar(d); contar(); pintarPie(); render(true);
    store.set('dcv-cat', JSON.stringify(d));
  }catch(e){ console.error(e); if (!D) sinDatos(true); }
})();
</script>
